[project]
name = "industrial-anomaly-detection"
version = "0.1.0"
description = "Reproducible W1 industrial visual anomaly-detection experiments"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anomalib>=2.4,<2.5",
    "ipykernel>=6.29,<7",
    "matplotlib>=3.9,<4",
    "opencv-python>=4.10,<5",
    "pandas>=2.2,<3",
    "pyyaml>=6,<7",
    "scikit-learn>=1.5,<2",
    "torch==2.6.0+cu124",
    "torchvision==0.21.0+cu124",
    "timm>=1.0,<2",
    "openpyxl>=3.1,<4",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iad_w1"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 100
target-version = "py311"
